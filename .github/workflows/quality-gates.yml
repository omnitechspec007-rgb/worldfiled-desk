name: WorldFiled quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: worldfiled-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Automated tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Vercel API router
        run: npm run build:api
      - name: Run complete automated test suite
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Verify generated API router remains current
        run: git diff --exit-code -- api/[name].js
