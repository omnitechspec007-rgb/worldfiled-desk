name: WorldFiled quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: worldfiled-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Automated tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install isolated PostgreSQL test client
        run: npm install --no-save --no-audit --no-fund pg
      - name: Run real PostgreSQL migration and transaction tests
        run: node tests/db/migration008.test.mjs && node tests/db/migration015.test.mjs
      - name: Generate Vercel API router
        run: npm run build:api
      - name: Run complete automated test suite
        run: npm test
      - name: Build production application
        run: npm run build
